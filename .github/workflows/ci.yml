name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install PHP test tools
        run: composer install --no-interaction --no-progress
        working-directory: tests/tools

      - name: Lint PHP scripts
        shell: bash
        run: |
          for script in skills/*/scripts/*.php; do
            php -l "$script"
          done
          php tests/tools/vendor/bin/pint --test --preset laravel skills
          php tests/tools/vendor/bin/phpstan analyse --level=max --no-progress skills

      - name: Lint Python scripts
        shell: bash
        run: |
          uvx ruff@0.17.4 check --select E,F,I,B,UP,BLE,PLC0415,DTZ --line-length 110 --target-version py311 scripts/check_version.py tests/*.py
          uvx ruff@0.17.4 format --check --line-length 100 --target-version py311 scripts/check_version.py tests/*.py
          uvx mypy@2.4.1 --strict --python-version 3.11 scripts/check_version.py

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Install benchmark packages
        run: npm ci
        working-directory: scripts

      - name: Check token budgets
        run: node check-tokens.mjs
        working-directory: scripts
